name: Test

on:
  push:
    branches:
      - '**'
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  pull_request:

permissions:
  contents: read

jobs:
  windows-tests:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Verify generated release
        shell: powershell
        run: .\build\Build-Release.ps1 -Check

      - name: Run Windows tests
        shell: powershell
        run: .\tests\Run-Tests.ps1

      - name: Confirm the build made no changes
        shell: powershell
        run: git diff --exit-code -- Spicetify-Spotify-Manager.exe

      - name: Protect Windows release bytes and version agreement
        shell: powershell
        run: |
          $record = [IO.File]::ReadAllText((Resolve-Path .\build\windows-release.sha256)).TrimEnd("`r", "`n")
          if ($record -cnotmatch '^([a-f0-9]{64})  Spicetify-Spotify-Manager\.exe$') { throw 'Invalid Windows hash record.' }
          $expected = $Matches[1]
          $actual = (Get-FileHash -LiteralPath .\Spicetify-Spotify-Manager.exe -Algorithm SHA256).Hash
          if ($actual -ne $expected) { throw "Windows release SHA-256 changed: $actual" }
          $version = [IO.File]::ReadAllText((Resolve-Path .\VERSION)).Trim()
          $reported = & .\Spicetify-Spotify-Manager.exe --version
          if ($LASTEXITCODE -ne 0 -or $reported -cne "Spicetify Spotify Manager $version") { throw 'EXE version mismatch.' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -cne "v$version") { throw 'Tag version mismatch.' }

  linux-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install ShellCheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck

      - name: Verify generated Linux release
        run: ./build/build-linux-release.sh --check

      - name: Run ShellCheck
        run: shellcheck -x src/linux/core.sh src/linux/main.sh build/build-linux-release.sh tests/run-linux-tests.sh Spicetify-Spotify-Manager-Linux.sh

      - name: Run Linux tests
        run: ./tests/run-linux-tests.sh

      - name: Protect generated files and platform line endings
        run: |
          git diff --exit-code -- Spicetify-Spotify-Manager-Linux.sh Spicetify-Spotify-Manager.exe
          test -x Spicetify-Spotify-Manager-Linux.sh
          ! LC_ALL=C grep -q $'\r' Spicetify-Spotify-Manager-Linux.sh
          sha256sum --check build/windows-release.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    needs: [windows-tests, linux-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate stable tag and release files
        run: |
          fail() {
            echo "::error::$1"
            exit 1
          }
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            fail "Release tags must use stable semantic versioning such as v1.2.3."
          fi
          [[ "$(git cat-file -t "$GITHUB_REF_NAME")" == tag ]] || fail "$GITHUB_REF_NAME is not an annotated tag."
          [[ "$(git rev-parse "$GITHUB_REF_NAME^{}")" == "$GITHUB_SHA" ]] || fail "$GITHUB_REF_NAME does not point to the workflow commit."
          [[ -f Spicetify-Spotify-Manager.exe ]] || fail "The Windows release file is missing."
          [[ "$(head -c 2 Spicetify-Spotify-Manager.exe)" == MZ ]] || fail "The Windows release is not a PE executable."
          sha256sum --check build/windows-release.sha256
          [[ -x Spicetify-Spotify-Manager-Linux.sh ]] || fail "The Linux release file is missing or is not executable."
          tag_version=${GITHUB_REF_NAME#v}
          project_version=$(< VERSION)
          linux_version=$(./Spicetify-Spotify-Manager-Linux.sh --version | awk '{print $NF}')
          [[ "$project_version" == "$tag_version" ]] || fail "Project version $project_version does not match tag $tag_version."
          # The required Windows job executes the EXE and verifies its version
          # against VERSION and this exact tag. Ubuntu verifies those same bytes.
          [[ "$linux_version" == "$tag_version" ]] || fail "Linux version $linux_version does not match tag $tag_version."
          ./build/build-linux-release.sh --check
          sha256sum Spicetify-Spotify-Manager.exe Spicetify-Spotify-Manager-Linux.sh > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Create stable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::error::A GitHub Release already exists for $GITHUB_REF_NAME. Refusing to replace its assets."
            exit 1
          fi
          cat > RELEASE_NOTES.md <<EOF
          Stable $GITHUB_REF_NAME contains the complete Windows manager and the package-aware Linux manager.

          Windows and Ubuntu validation completed before publication. Linux support remains package-specific, and real graphical CachyOS, Flatpak Spotify, and visual Spicetify runtime testing may still be outstanding as documented in the README.
          EOF
          gh release create "$GITHUB_REF_NAME" \
            Spicetify-Spotify-Manager.exe \
            Spicetify-Spotify-Manager-Linux.sh \
            SHA256SUMS \
            --draft \
            --title "$GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md \
            --verify-tag
          assets=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')
          for expected in Spicetify-Spotify-Manager.exe Spicetify-Spotify-Manager-Linux.sh SHA256SUMS; do
            grep -Fqx "$expected" <<< "$assets" || {
              echo "::error::Release asset is missing after upload: $expected"
              exit 1
            }
          done
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
